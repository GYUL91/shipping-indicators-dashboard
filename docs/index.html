<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해운 지표 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121b2e;
    --panel-border: #223049;
    --text: #e7edf7;
    --text-dim: #93a3bd;
    --accent: #3aa0ff;
    --accent-2: #29d3a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px 12px;
    border-bottom: 1px solid var(--panel-border);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--text-dim); font-size: 13px; }
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
    padding: 20px 32px 40px;
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; padding: 16px; }
    header { padding: 16px 16px 8px; }
  }
  .sidebar {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px;
    align-self: start;
  }
  .category {
    margin-bottom: 18px;
  }
  .category h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 8px;
  }
  .indicator-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .indicator-btn:hover { background: #1a2740; }
  .indicator-btn.active {
    background: rgba(58,160,255,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .main {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px;
    min-height: 480px;
  }
  .main-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .main-header h2 { margin: 0; font-size: 18px; }
  .meta { color: var(--text-dim); font-size: 12px; }
  .empty {
    color: var(--text-dim);
    text-align: center;
    padding: 80px 0;
  }
  canvas { max-height: 460px; }
  .updated {
    color: var(--text-dim);
    font-size: 11px;
    padding: 16px 32px 0;
  }
</style>
</head>
<body>
<header>
  <h1>해운 지표 대시보드</h1>
  <p>운임 지수 · 물동량/처리량 · 선박/선대 · 유가/연료비</p>
</header>
<div class="updated" id="updated"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <section class="main">
    <div class="main-header">
      <h2 id="chart-title">지표를 선택하세요</h2>
      <span class="meta" id="chart-meta"></span>
    </div>
    <div id="chart-wrap"><div class="empty">왼쪽에서 지표를 선택하면 시계열 차트가 표시됩니다.</div></div>
  </section>
</div>

<script>
const CATEGORY_LABELS = {
  freight_index: "운임 지수",
  cargo_volume: "물동량/처리량",
  fleet: "선박/선대",
  fuel_price: "유가/연료비",
};

let chartInstance = null;

async function main() {
  const res = await fetch('data/all.json', { cache: 'no-store' });
  const payload = await res.json();

  document.getElementById('updated').textContent =
    payload.generated_at ? `마지막 갱신: ${new Date(payload.generated_at).toLocaleString('ko-KR')}` : '';

  const byCategory = {};
  for (const ind of payload.indicators) {
    (byCategory[ind.category] ||= []).push(ind);
  }

  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';

  const categories = Object.keys(CATEGORY_LABELS).filter(c => byCategory[c]);
  for (const cat of categories) {
    const section = document.createElement('div');
    section.className = 'category';
    const h3 = document.createElement('h3');
    h3.textContent = CATEGORY_LABELS[cat] || cat;
    section.appendChild(h3);

    for (const ind of byCategory[cat]) {
      const btn = document.createElement('button');
      btn.className = 'indicator-btn';
      btn.textContent = ind.name;
      btn.addEventListener('click', () => selectIndicator(ind, btn));
      section.appendChild(btn);
    }
    sidebar.appendChild(section);
  }

  if (payload.indicators.length === 0) {
    document.getElementById('chart-wrap').innerHTML =
      '<div class="empty">아직 수집된 데이터가 없습니다. collectors/run_all.py 를 실행해 주세요.</div>';
  } else {
    const firstBtn = sidebar.querySelector('.indicator-btn');
    if (firstBtn) firstBtn.click();
  }
}

function selectIndicator(ind, btnEl) {
  document.querySelectorAll('.indicator-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');

  document.getElementById('chart-title').textContent = ind.name;
  document.getElementById('chart-meta').textContent =
    `${ind.unit || ''} · 출처: ${ind.source} · ${ind.region || ''}`;

  const wrap = document.getElementById('chart-wrap');
  wrap.innerHTML = '<canvas id="chart-canvas"></canvas>';

  if (chartInstance) chartInstance.destroy();

  const ctx = document.getElementById('chart-canvas').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ind.observations.map(o => o.date),
      datasets: [{
        label: ind.name,
        data: ind.observations.map(o => o.value),
        borderColor: '#3aa0ff',
        backgroundColor: 'rgba(58,160,255,0.12)',
        fill: true,
        tension: 0.15,
        pointRadius: 0,
        borderWidth: 2,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: '#93a3bd', maxTicksLimit: 12 }, grid: { color: '#223049' } },
        y: { ticks: { color: '#93a3bd' }, grid: { color: '#223049' } },
      },
      plugins: { legend: { display: false } },
    },
  });
}

main().catch(err => {
  document.getElementById('chart-wrap').innerHTML =
    `<div class="empty">데이터 로드 실패: ${err.message}</div>`;
});
</script>
</body>
</html>
